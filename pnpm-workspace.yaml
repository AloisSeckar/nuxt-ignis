packages:
  - core
  - demos/*
  - docs
  - modules/*

nodeLinker: hoisted

peerDependencyRules:
  ignoreMissing:
    - tailwindcss
    - embla-carousel
    - '@tiptap/y-tiptap'
    - '@tiptap/extensions'
    - yjs
    - unstorage
    - '@unhead/bundler'
  allowedVersions:
    focus-trap: '8'

catalog:
  '@formkit/nuxt': 2.1.2
  '@maas/vue-equipment': 1.0.0-beta.88
  '@nuxt-ignis/content': 0.2.0
  '@nuxt-ignis/db': 0.2.0
  '@nuxt-ignis/default': 0.2.0
  '@nuxt-ignis/forms': 0.2.0
  '@nuxt-ignis/ui': 0.2.0
  '@nuxt-ignis/utils': 0.2.0
  '@nuxt-ignis/validation': 0.2.0
  '@nuxt/content': 3.16.2
  '@nuxt/devtools': ^4.0.0-alpha.20
  '@nuxt/eslint': 1.17.0
  '@nuxt/eslint-config': 1.17.0
  '@nuxt/fonts': 1.0.1
  '@nuxt/image': 2.2.0
  '@nuxt/kit': 4.6.2
  '@nuxt/module-builder': ^1.0.3
  '@nuxt/schema': 4.6.2
  '@nuxt/scripts': 1.3.12
  '@nuxt/test-utils': ^4.3.4
  '@nuxt/ui': 4.12.0
  '@nuxtjs/i18n': 10.6.0
  '@nuxtjs/tailwindcss': 6.14.0
  '@nuxtjs/seo': 6.0.1
  '@nuxtjs/supabase': 2.1.0
  '@pinia/nuxt': 1.0.3
  '@stefanobartoletti/nuxt-social-share': 3.3.0
  '@tailwindcss/vite': 4.3.3
  '@types/node': ^26.6.5
  '@vueform/nuxt': 1.31.0
  '@vueform/vueform': 1.13.13
  '@vueuse/core': 15.0.0
  '@vueuse/nuxt': 15.0.0
  'changelogen': ^0.6.2
  'consola': 3.4.2
  'cross-env': ^10.1.0
  'date-fns': 4.4.0
  'defu': 6.1.7
  'elrh-cosca': 0.4.3
  'elrh-pslo': 1.1.6
  'eslint': ^10.13.0
  'magic-regexp': 0.11.2
  'nuxt': 4.6.2
  'nuxt-auth-utils': 0.5.32
  'nuxt-charts': 2.2.3
  'nuxt-neon': 0.9.0
  'nuxt-security': 2.6.0
  'nuxt-spec': 0.4.0
  'open-props': 1.7.23
  'oxc-minify': ^0.154.0
  'pinia': 4.1.0
  'postcss-jit-props': 1.0.16
  'semver': ^7.8.5
  'tailwindcss': 4.3.3
  'typescript': 6.0.3
  'valibot': 1.5.0
  'vitepress': ^2.0.0-alpha.20
  'vitepress-plugin-group-icons': ^1.8.1
  'vitest': ^5.0.5
  'vue': 3.5.44
  'vue-component-meta': '3.3.13'
  'vue-component-type-helpers': '3.3.13'
  'vue-router': 5.4.0
  'vue-tsc': 3.3.13
  'zod': 4.6.7

trustPolicy: no-downgrade

minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  # exclusions for internal modules
  - '@nuxt-ignis/content'
  - '@nuxt-ignis/default'
  - '@nuxt-ignis/db'
  - '@nuxt-ignis/forms'
  - '@nuxt-ignis/ui'
  - '@nuxt-ignis/utils'
  - '@nuxt-ignis/validation'
  # exclusions for trusted Vue/Nuxt packages
  # and manually checked one-time exceptions
  # build 2026-10-22
  - '@nuxt/image@2.2.0'
  - 'nuxt-spec@0.4.0'
  - '@nuxt/devtools-assets@4.0.0-beta.7'
  - '@nuxt/devtools-kit@4.0.0-beta.7'
  - '@nuxt/devtools@4.0.0-beta.7'

allowBuilds:
  # allows node-gyp build of associated native binaries from local sources
  # kept enabled because 'sharp' is a runtime dependency
  sharp: true
  # provides fallback repair of platform-specific Rust native engine
  # kept enabled because it can actively detect and fix problems on some platforms
  unrs-resolver: true
  # allows node-gyp build of associated native binaries from local sources
  # disabled because it would require an explicit opt-in
  '@parcel/watcher': false
  # provides fallback download of platform-specific Rust native engine
  # disabled because the required dependency is already resolved by pnpm install
  '@tailwindcss/oxide': false
  # optimization for CLI usage of 'esbuild'
  # disabled because its runtime resolves native binaries itself
  esbuild: false
  # compatibility feature for Vue 2 and Vue 3
  # disabled because project is Vue 3 only
  vue-demi: false
  # post-install script is empty in published package
  # disabled because there is no action executed
  maplibre-gl: false

overrides:
  # Vite v8
  vite: ^8.3.0
  # TypeScript v6
  typescript: ^6.0.0
  # suspicious v4 comming from @formkit/nuxt@2.1.2
  chokidar: ^5.0.0
  # suspicious v6 comming from nuxt-security@2.6.0
  semver: ^7.7.0
  # suspicious v6 comming from nuxt-neon@0.9.0 (via @neondatabase/serverless@1.0.2)
  undici-types: ^8.0.0

verifyDepsBeforeRun: error

# allow iterating over sub-module versions without having to commit
# before the feature is finally settled
gitChecks: false
